services:
  _defaults:
    autowire: true
  ai_logging.post_request_subscriber:
    class: '\Drupal\ai_logging\EventSubscriber\LogPostRequestEventSubscriber'
    arguments: ['@entity_type.manager', '@config.factory', '@module_handler']
    tags:
      - { name: 'event_subscriber' }
  ai_logging.prune:
    class: '\Drupal\ai_logging\Cron\AiLogPruning'
    arguments: ['@config.factory', '@entity_type.manager', '@logger.factory']
  Drupal\ai_logging\Cron\AiLogPruning: '@ai_logging.prune'
  Drupal\ai_logging\Hook\CronHooks:
    class: Drupal\ai_logging\Hook\CronHooks
  Drupal\ai_logging\Hook\FormHooks:
    class: Drupal\ai_logging\Hook\FormHooks
  ai_logging.response_text_formatter:
    class: Drupal\ai_logging\ResponseTextFormatter
  Drupal\ai_logging\ResponseTextFormatter: '@ai_logging.response_text_formatter'
  ai_logging.thread_repository:
    class: Drupal\ai_logging\Thread\ThreadRepository
  Drupal\ai_logging\Thread\ThreadRepository: '@ai_logging.thread_repository'
  ai_logging.thread_label_resolver:
    class: Drupal\ai_logging\Thread\DefaultThreadLabelResolver
  Drupal\ai_logging\Thread\ThreadLabelResolverInterface: '@ai_logging.thread_label_resolver'
