ckeditor5.plugin.ai_ckeditor_ai:
  type: mapping
  label: AI CKEditor configuration
  mapping:
    dialog:
      type: mapping
      label: 'Dialog options'
      mapping:
        autoresize:
          type: string
          label: 'The CSS value at which auto resize in the modal should be triggered.'
        height:
          type: string
          label: 'A pixel or percent value of what the height of the modal should be.'
        width:
          type: string
          label: 'A pixel or percent value of what the width of the modal should be.'
        dialog_class:
          type: string
          label: 'A CSS class to apply to the modal dialog.'
    plugins:
      type: sequence
      label: 'Plugins'
      orderby: key
      sequence:
        type: ckeditor5.plugin.ai_ckeditor_ai.[%key]
ai_ckeditor.settings:
  type: config_object
  label: 'AI Ckeditor Settings'
  mapping:
    prompts:
      type: mapping
      label: 'Prompts settings'
      mapping:
        complete:
          type: string
          label: 'Completion prompt ID'
          description: 'The default prompt config entity to use as a completion pre-prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        modify_prompt:
          type: string
          label: 'Modify prompt ID'
          description: 'The default prompt config entity to use as a modify prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        reformat:
          type: string
          label: 'Reformat prompt ID'
          description: 'The default prompt config entity to use as a reformat prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        spellfix:
          type: string
          label: 'Spellfix prompt ID'
          description: 'The default prompt config entity to use as a spelling fix prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        summarize:
          type: string
          label: 'Summarize prompt ID'
          description: 'The default prompt config entity to use as a summarize prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        tone:
          type: string
          label: 'Tone adjustment prompt ID'
          description: 'The default prompt config entity to use as a tone adjustment prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'
        translate:
          type: string
          label: 'Translate prompt ID'
          description: 'The default prompt config entity to use as a translation prompt.'
          constraints:
            ConfigExists:
              prefix: 'ai.ai_prompt.'

# Individual AiCKEditor plugins config schema.
ckeditor5.plugin.ai_ckeditor_ai_base:
  type: mapping
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    provider:
      type: string
      label: 'AI Provider-model'

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_help:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_completion:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_modify_prompt:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_reformat_html:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_spellfix:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_summarize:
  type: ckeditor5.plugin.ai_ckeditor_ai_base

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_tone:
  type: ckeditor5.plugin.ai_ckeditor_ai_base
  mapping:
    autocreate:
      type: boolean
      label: 'Autocreate'
    tone_vocabulary:
      type: string
      label: 'Tone vocabulary'
    use_description:
      type: boolean
      label: 'Use description'

ckeditor5.plugin.ai_ckeditor_ai.ai_ckeditor_translate:
  type: ckeditor5.plugin.ai_ckeditor_ai_base
  mapping:
    language_source:
      type: string
      label: 'Language source'
      constraints:
        Choice:
          choices:
            - lang
            - tax
    autocreate:
      type: boolean
      label: 'Autocreate'
    translate_vocabulary:
      type: string
      label: 'Translate vocabulary'
    use_description:
      type: boolean
      label: 'Use description'
