langcode: en
status: true
dependencies:
  enforced:
    module:
      - ai_ckeditor
id: ai_ckeditor_translate__default
label: 'Default prompt for translating CKEditor text'
type: ai_ckeditor_translate
prompt: |
  Do not respond, only respond with the translated text, no pleasantries.
  Translate the following text into {lang}
  {% if use_description %}
    Translation context: {context}
  {% endif %}
  The text that we want to translate is the following:
  {inputText}
