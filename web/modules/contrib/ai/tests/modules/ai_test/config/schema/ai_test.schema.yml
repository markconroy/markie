# Schema for the configuration files of the AI Test integration module.
ai_test.settings:
  type: config_object
  label: 'AI Test integration settings'
  mapping:
    catch_results:
      type: boolean
      label: 'Catch results'
      description: 'Whether to catch results from AI mock providers.'
      default_value: false
    catch_processing_time:
      type: boolean
      label: 'Catch processing time'
      description: 'Whether to catch processing time from AI mock providers.'
      default_value: false
    provider_config:
      type: ai.provider_config
      label: 'AI provider configuration'

plugin.plugin_configuration.search_api_backend.ai_test_vdb_config:
  type: mapping
  label: 'AI VDB configuration test backend settings'
  mapping:
    database:
      type: string
      label: 'Database type'
    database_settings:
      type: mapping
      label: 'Database settings'
      mapping:
        database_name:
          type: string
          label: 'Database name'
        collection:
          type: string
          label: 'Collection name'
        metric:
          type: string
          label: 'Similarity metric'
    embeddings_engine:
      type: string
      label: 'Embeddings engine'
    embeddings_engine_configuration:
      type: mapping
      label: 'Embeddings engine configuration'
      mapping:
        set_dimensions:
          type: boolean
          label: 'Whether to set dimensions manually'
        dimensions:
          type: integer
          label: 'Number of dimensions'
    embedding_strategy:
      type: string
      label: 'Embedding strategy'
    embedding_strategy_configuration:
      type: mapping
      label: 'Embedding strategy configuration'
      mapping:
        chunk_size:
          type: string
          label: 'Chunk size'
        chunk_min_overlap:
          type: string
          label: 'Minimum chunk overlap'
        contextual_content_max_percentage:
          type: string
          label: 'Maximum contextual content percentage'

# Settings schema for the test-only counting_stub_guardrail plugin.
ai.guardrail.settings.counting_stub_guardrail:
  type: mapping
  label: 'Counting Stub Guardrail settings'
  mapping:
    tag:
      type: string
      label: 'State counter tag'
    mode:
      type: string
      label: 'Result mode (pass or stop)'
    message:
      type: string
      label: 'Result message'
    score:
      type: float
      label: 'Stop result score'

# Same shape as the deterministic variant; defined separately because guardrail
# settings schemas key off the plugin id.
ai.guardrail.settings.nondet_counting_stub_guardrail:
  type: ai.guardrail.settings.counting_stub_guardrail
  label: 'Non-Deterministic Counting Stub Guardrail settings'

# Same shape; a separate id because the schema keys off the plugin id.
ai.guardrail.settings.inner_chat_nondet_stub_guardrail:
  type: ai.guardrail.settings.counting_stub_guardrail
  label: 'Inner-Chat Non-Deterministic Stub Guardrail settings'

# Same shape; used by the fiber isolation test.
ai.guardrail.settings.fiber_suspending_nondet_stub_guardrail:
  type: ai.guardrail.settings.counting_stub_guardrail
  label: 'Fiber-Suspending Non-Deterministic Stub Guardrail settings'
