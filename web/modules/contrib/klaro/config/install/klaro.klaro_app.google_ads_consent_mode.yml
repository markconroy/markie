id: google_ads_consent_mode
label: 'Google Ads'
description: 'Measures ad performance and personalizes advertising.'
langcode: en
status: false
default: false
purposes:
  - advertising
cookies: { }
required: false
opt_out: false
only_once: false
weight: 1
info_url: 'https://ads.google.com/'
privacy_policy_url: 'https://policies.google.com/privacy'
javascripts: { }
attachments: { }
on_init: ''
on_accept: "gtag('consent', 'update', {\r\n  'ad_storage': 'granted',\r\n  'ad_user_data': 'granted',\r\n  'ad_personalization': 'granted'\r\n});"
on_decline: "gtag('consent', 'update', {\r\n  'ad_storage': 'denied',\r\n  'ad_user_data': 'denied',\r\n  'ad_personalization': 'denied'\r\n});"
