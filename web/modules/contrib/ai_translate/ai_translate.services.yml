services:
  ai_translate.subscriber:
    class: Drupal\ai_translate\Routing\AiTranslateRouteSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }
  ai_translate.text_extractor:
    class: Drupal\ai_translate\TextExtractor
    arguments:
      - '@entity_type.manager'
      - '@plugin.manager.text_extractor'
  Drupal\ai_translate\TextExtractorInterface: '@ai_translate.text_extractor'
  ai_translate.text_translator:
    class: Drupal\ai_translate\TextTranslator
    arguments:
      - '@entity_type.manager'
      - '@language_manager'
      - '@config.factory'
      - '@ai.provider'
      - '@twig'
      - '@module_handler'
      - '@cache.ai_translate'
  Drupal\ai_translate\TextTranslatorInterface: '@ai_translate.text_translator'
  ai_translate.translation_orchestrator:
    class: Drupal\ai_translate\EntityTranslationOrchestrator
    autowire: true
  Drupal\ai_translate\EntityTranslationOrchestratorInterface: '@ai_translate.translation_orchestrator'
  plugin.manager.text_extractor:
    class: Drupal\ai_translate\FieldTextExtractorPluginManager
    parent: default_plugin_manager
  cache.ai_translate:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [ai_translate]
