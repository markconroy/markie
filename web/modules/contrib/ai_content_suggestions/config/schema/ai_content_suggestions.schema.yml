ai_content_suggestions.plugin_config.*:
  type: ai_content_suggestions.plugin_config_base

ai_content_suggestions.plugin_config_base:
  type: mapping
  label: 'Plugin configuration'
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    model:
      type: string
      label: 'Model'

ai_content_suggestions.plugin_config.summarise:
  type: ai_content_suggestions.plugin_config_base
  label: 'Summarise plugin configuration'
  mapping:
    prompt:
      type: text
      label: 'Prompt'

ai_content_suggestions.plugin_config.readability:
  type: ai_content_suggestions.plugin_config_base
  label: 'Readability plugin configuration'
  mapping:
    prompt:
      type: text
      label: 'Prompt'

ai_content_suggestions.plugin_config.title_suggest:
  type: ai_content_suggestions.plugin_config_base
  label: 'Title suggestion plugin configuration'
  mapping:
    prompt:
      type: text
      label: 'Prompt'

ai_content_suggestions.plugin_config.tone:
  type: ai_content_suggestions.plugin_config_base
  label: 'Tone plugin configuration'
  mapping:
    prompt:
      type: text
      label: 'Prompt'
    taxonomy:
      type: string
      label: 'Tone taxonomy vocabulary'
    taxonomy_enabled:
      type: boolean
      label: 'Enable custom tone taxonomy'

ai_content_suggestions.plugin_config.taxonomy_suggest:
  type: ai_content_suggestions.plugin_config_base
  label: 'Taxonomy suggest plugin configuration'
  mapping:
    prompt_open:
      type: string
      label: 'Open taxonomy suggestion prompt'
      constraints:
        ConfigExists: 'ai.ai_prompt'
    prompt_from_voc:
      type: string
      label: 'Vocabulary-based taxonomy suggestion prompt'
      constraints:
        ConfigExists: 'ai.ai_prompt'

ai_content_suggestions.settings:
  type: config_object
  label: 'AI Content Suggestions settings'
  mapping:
    field_widget_prompt:
      type: text
      label: 'System prompt for field widget based suggestions'
    plugins:
      type: sequence
      label: Plugins
      orderby: key
      constraints:
        NotNull: []
      sequence:
        type: ai_content_suggestions.plugin_config.[%key]
        label: 'Plugin ID'
        constraints:
          NotNull: []
    entity_types:
      type: sequence
      label: 'Selected Entity Types'
      orderby: key
      constraints:
        PluginExists:
          manager: entity_type.manager
          interface: Drupal\Core\Entity\ContentEntityInterface
          plugin_id: '%key'
      sequence:
        type: mapping
        mapping:
          bundles:
            type: sequence
            label: 'Bundles'
            constraints:
              NotNull: []
            sequence:
              type: string
              label: 'Bundle Machine Name'
              constraints:
                EntityBundleExists: '%parent.%key'
          mode:
            type: string
            label: 'Mode for entity types'
            constraints:
              Choice:
                - enable
                - disable

field_widget_action.plugin.prompt_content_suggestion:
  type: field_widget_action_plugin_base
  mapping:
    settings:
      type: mapping
      mapping:
        model:
          type: string
          label: 'AI Model to use'
        prompt:
          type: text
          label: 'Prompt'
        display_on_focus:
          type: boolean
          label: 'Display buttons on focus'
